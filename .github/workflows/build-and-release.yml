name: Build and Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist

      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Debug - Inspect package dependencies
        run: |
          echo "--- packageProductDependencies section ---"
          grep -A 30 "packageProductDependencies" SmartMotos.xcodeproj/project.pbxproj || echo "NOT FOUND"
          echo "--- XCRemoteSwiftPackageReference / XCSwiftPackageProductDependency (Firebase) ---"
          grep -B2 -A5 "FirebaseCore" SmartMotos.xcodeproj/project.pbxproj || echo "FirebaseCore STRING NOT FOUND AT ALL IN PBXPROJ"

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project SmartMotos.xcodeproj -scheme SmartMotos

      - name: Build for Simulator
        run: |
          xcodebuild -project SmartMotos.xcodeproj \
            -scheme SmartMotos \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app for Appetize
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r SmartMotos-simulator.zip SmartMotos.app

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: build/Build/Products/Debug-iphonesimulator/SmartMotos-simulator.zip

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore google-services.json
        run: printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-build
          path: app/build/outputs/apk/debug/app-debug.apk

  create-release:
    name: Create GitHub Release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-build
          path: ./release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-build
          path: ./release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./release-assets/SmartMotos-simulator.zip
            ./release-assets/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


