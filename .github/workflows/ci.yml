name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Resolve Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project SmartMotos.xcodeproj -scheme SmartMotos
      - name: Build for Simulator
        run: |
          xcodebuild -project SmartMotos.xcodeproj \
            -scheme SmartMotos \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug

  build-functions:
    name: Typecheck Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: functions
        run: npm ci
      - name: Build
        working-directory: functions
        run: npm run build
