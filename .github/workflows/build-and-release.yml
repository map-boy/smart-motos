name: Build and Release (iOS)
on:
  push:
    tags:
      - 'v*'
jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist

      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Debug - Inspect package dependencies
        run: |
          echo "--- packageProductDependencies section ---"
          grep -A 30 "packageProductDependencies" SmartMotos.xcodeproj/project.pbxproj || echo "NOT FOUND"
          echo "--- XCRemoteSwiftPackageReference / XCSwiftPackageProductDependency (Firebase) ---"
          grep -B2 -A5 "FirebaseCore" SmartMotos.xcodeproj/project.pbxproj || echo "FirebaseCore STRING NOT FOUND AT ALL IN PBXPROJ"

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project SmartMotos.xcodeproj -scheme SmartMotos

      - name: Build for Simulator
        run: |
          xcodebuild -project SmartMotos.xcodeproj \
            -scheme SmartMotos \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app for Appetize
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r SmartMotos-simulator.zip SmartMotos.app

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: build/Build/Products/Debug-iphonesimulator/SmartMotos-simulator.zip

  create-release:
    name: Create GitHub Release
    needs: [build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-build
          path: ./release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release-assets/SmartMotos-simulator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

